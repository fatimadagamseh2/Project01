<!DOCTYPE html>
<html lang="en">

	<head>
   
		<meta charset="UTF-8">
  
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
   
		<title>User Registration</title>

	</head>

	<body>

    
		<form>

       
			<label for="fullname">Full Name</label>
      
			<input type="text" id="fullname" name="fullname" required minlength="3">

       
			<br><br>

     
			<label for="email">Email</label>
      
			<input type="email" id="email" name="email" required>

       
			<br><br>

       
			<label for="password">Password</label>
       
			<input type="password" id="password" name="password" required minlength="8">

      
			<br><br>

      
			<label for="student">Student</label>
     
			<input type="radio" id="student" name="role" value="student">

       
			<label for="professional">Professional</label>
       
			<input type="radio" id="professional" name="role" value="professional">

      
			<br><br>

       
			<input type="checkbox" id="agreement" name="agreement" required>
    
			<label for="agreement">I agree to the terms and conditions</label>

     
			<br><br>

       
			<label for="country">Country</label>
     
			<select id="country" name="country" required>
         
				<option value="">Select your country</option>
           
				<option value="jordan">Jordan</option>
           
				<option value="palestine">Palestine</option>
         
				<option value="saudi-arabia">Saudi Arabia</option>

			</select>

      
			<br><br>

			<label for="message">About You</label>
       
			<textarea id="message" name="message" minlength="10" required></textarea>

   
			<br><br>

       
			<button type="submit">Register</button>


		</form>


	</body>
</html>
